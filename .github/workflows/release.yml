name: TrackBit Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release
      - name: Create web zip
        run: cd build/web && zip -r ../../trackbit-web.zip .
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackbit-web
          path: trackbit-web.zip

  release:
    name: Create Release
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: trackbit-apk
      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: trackbit-web
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-release.apk
            trackbit-web.zip
          body: |
            ## TrackBit ${{ github.ref_name }}
            
            ### Downloads
            - **Android APK**: `app-release.apk` - Download and install on Android
            - **Web App**: `trackbit-web.zip` - Extract and open `index.html` in browser
            
            ### What's New
            See the release notes below for changes in this version.
            
            ### Installation
            
            #### Android
            1. Download `app-release.apk`
            2. Enable "Install from unknown sources" in your device settings
            3. Open the APK file to install
            
            #### Web
            1. Download `trackbit-web.zip`
            2. Extract the zip file
            3. Open `index.html` in your browser
            
            #### Build from Source
            ```bash
            git clone https://github.com/anonbanana/trackbit.git
            cd trackbit
            flutter pub get
            flutter run
            ```
            
            ### Support
            - Report bugs: [GitHub Issues](https://github.com/anonbanana/trackbit/issues)
            - Donate: [Sponsor](https://github.com/sponsors/anonbanana)
