repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  - repo: local
    hooks:
      - id: flutter-analyze
        name: Flutter Analyze
        entry: flutter analyze
        language: system
        types: [dart]
        pass_filenames: false
        always_run: true

      - id: dart-format
        name: Dart Format Check
        entry: dart format --set-exit-if-changed --output=none
        language: system
        types: [dart]
        pass_filenames: true

      - id: flutter-test
        name: Flutter Test
        entry: flutter test
        language: system
        types: [dart]
        pass_filenames: false
        always_run: true
