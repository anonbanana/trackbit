name: trackbit
description: A comprehensive offline-first business management application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0
  go_router: ^14.8.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.18.0
  web_socket_channel: ^3.0.2
  multicast_dns: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.24.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  custom_lint: ^0.7.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
